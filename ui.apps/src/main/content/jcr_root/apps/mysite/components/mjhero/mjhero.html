<!--/*
    MJ Editorial Hero — full-bleed cinematic opening.

    The artwork is the section, not a band under it: it fills the viewport and the headline
    is set over it at display scale. The type is composited with mix-blend-mode: difference
    so it inverts against whatever passes beneath it — which is why no scrim is needed and
    why the image can keep its full tonal range instead of being dimmed to make room.

    With no artwork authored the same markup collapses to a purely typographic opening on
    paper. Both are deliberate; neither is a fallback for the other.
*/-->
<sly data-sly-use.hero="com.mysite.core.models.MjHero"/>

<section class="cmp-mjhero cmp-mjhero--${hero.fileReference ? 'cinematic' : 'typographic'}"
         data-sly-test.hasContent="${!hero.empty}"
         id="${hero.id}"
         data-cmp-data-layer="${hero.data.json}">

    <div class="cmp-mjhero__stage" data-sly-test="${hero.fileReference}">
        <!--/* HTL drops an attribute whose expression is empty, so a decorative alt=""
               has to be written as a literal on its own variant. */-->
        <img class="cmp-mjhero__img"
             src="${hero.fileReference}"
             alt="${hero.alt}"
             fetchpriority="high"
             decoding="async"
             data-sly-test="${hero.alt}"/>
        <img class="cmp-mjhero__img"
             src="${hero.fileReference}"
             alt=""
             fetchpriority="high"
             decoding="async"
             data-sly-test="${!hero.alt}"/>
    </div>

    <p class="cmp-mjhero__eyebrow" data-sly-test="${hero.eyebrow}">${hero.eyebrow}</p>

    <h1 class="cmp-mjhero__title" data-sly-element="${hero.headingTag}">
        <span class="cmp-mjhero__line cmp-mjhero__line--one">${hero.lineOne}</span>
        <span class="cmp-mjhero__line cmp-mjhero__line--two"
              data-sly-test="${hero.lineTwo}">${hero.lineTwo}</span>
    </h1>

    <div class="cmp-mjhero__foot">
        <p class="cmp-mjhero__standfirst" data-sly-test="${hero.standfirst}">${hero.standfirst}</p>

        <a class="cmp-mjhero__cta"
           data-sly-test="${hero.ctaText && hero.ctaUrl}"
           href="${hero.ctaUrl}"
           id="${hero.ctaId}"
           data-cmp-data-layer="${hero.ctaDataLayerJson}"
           data-cmp-clickable>${hero.ctaText}<span class="cmp-mjhero__cta-mark" aria-hidden="true">&#8594;</span></a>

        <p class="cmp-mjhero__cue" data-sly-test="${hero.scrollCue}" aria-hidden="true">${hero.scrollCue}</p>
    </div>
</section>

<sly data-sly-test="${!hasContent && wcmmode.edit}">
    <div class="cq-placeholder" data-emptytext="${'MJ Editorial Hero' @ i18n}"></div>
</sly>
