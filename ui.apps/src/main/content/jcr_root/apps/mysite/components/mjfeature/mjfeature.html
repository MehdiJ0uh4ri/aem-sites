<!--/*
    MJ Feature — one Content Fragment given the space of a magazine opener.

    Two variants, two compositions — not one composition recoloured.

      insight    the image breaks the container and runs to the right edge of the viewport
                 while the headline crosses onto it from the left. Asymmetric, on paper.
      casestudy  full-bleed and immersive: the image fills the section and the story is
                 set into its lower left as a two-beat, challenge then outcome.

    Either way the module is not a single link target. Nesting the heading inside one large
    anchor would give a screen reader a link whose accessible name is the whole article
    summary, so the link stays an explicit, short call to action at the end of the copy.
*/-->
<sly data-sly-use.feature="com.mysite.core.models.MjFeature"/>

<section class="cmp-mjfeature cmp-mjfeature--${feature.variant}"
         data-sly-test.hasContent="${!feature.empty}"
         id="${feature.id}"
         data-cmp-data-layer="${feature.data.json}">

    <p class="cmp-mjfeature__eyebrow" data-sly-test="${feature.eyebrow}" data-cmp-reveal>${feature.eyebrow}</p>

    <div class="cmp-mjfeature__inner">
        <figure class="cmp-mjfeature__art" data-sly-test="${feature.fileReference}" data-cmp-reveal>
            <img class="cmp-mjfeature__img"
                 src="${feature.fileReference}"
                 alt="${feature.alt}"
                 loading="lazy"
                 decoding="async"
                 data-sly-test="${feature.alt}"/>
            <img class="cmp-mjfeature__img"
                 src="${feature.fileReference}"
                 alt=""
                 loading="lazy"
                 decoding="async"
                 data-sly-test="${!feature.alt}"/>
        </figure>

        <div class="cmp-mjfeature__copy" data-cmp-reveal>
            <p class="cmp-mjfeature__meta">
                <span class="cmp-mjfeature__kicker" data-sly-test="${feature.kicker}">${feature.kicker}</span>
                <span class="cmp-mjfeature__date" data-sly-test="${feature.meta}">${feature.meta}</span>
            </p>

            <h2 class="cmp-mjfeature__title" data-sly-element="${feature.headingTag}">${feature.title}</h2>

            <!--/* The two beats. A case study fills both and they are set as a pair of
                   ruled columns; an insight fills only the first and the wrapper collapses
                   to a plain block. */-->
            <div class="cmp-mjfeature__beats">
                <p class="cmp-mjfeature__standfirst" data-sly-test="${feature.standfirst}">
                    <span class="cmp-mjfeature__beat-label"
                          data-sly-test="${feature.variant == 'casestudy'}">Challenge</span>
                    ${feature.standfirst}
                </p>

                <p class="cmp-mjfeature__outcome" data-sly-test="${feature.outcome}">
                    <span class="cmp-mjfeature__beat-label">Outcome</span>
                    ${feature.outcome}
                </p>
            </div>

            <a class="cmp-mjfeature__cta"
               data-sly-test="${feature.ctaText && feature.ctaUrl}"
               href="${feature.ctaUrl}"
               id="${feature.ctaId}"
               data-cmp-data-layer="${feature.ctaDataLayerJson}"
               data-cmp-clickable>${feature.ctaText}<span class="cmp-mjfeature__cta-mark" aria-hidden="true">&#8594;</span></a>
        </div>
    </div>
</section>

<sly data-sly-test="${!hasContent && wcmmode.edit}">
    <div class="cq-placeholder" data-emptytext="${'MJ Feature — pick a Content Fragment' @ i18n}"></div>
</sly>
