<!--/*
    MJ Investment Signal.

    The figures are the image here: set at display scale, staggered down an asymmetric
    column and allowed to run past the right edge, against a tall image held at the left.
    A reader should take the mass of numbers before reading any one of them.

    The statement is still the heading and the figures are still a description list, so
    the reading order for a screen reader is claim first, then "assets under management:
    $410M" — none of which the visual arrangement is allowed to disturb.
*/-->
<sly data-sly-use.signal="com.mysite.core.models.MjSignal"/>

<section class="cmp-mjsignal cmp-mjsignal--${signal.fileReference ? 'columned' : 'open'}"
         data-sly-test.hasContent="${!signal.empty}"
         id="${signal.id}"
         data-cmp-data-layer="${signal.data.json}">

    <div class="cmp-mjsignal__column" data-sly-test="${signal.fileReference}" data-cmp-reveal>
        <img class="cmp-mjsignal__img"
             src="${signal.fileReference}"
             alt="${signal.alt}"
             loading="lazy"
             decoding="async"
             data-sly-test="${signal.alt}"/>
        <img class="cmp-mjsignal__img"
             src="${signal.fileReference}"
             alt=""
             loading="lazy"
             decoding="async"
             data-sly-test="${!signal.alt}"/>
    </div>

    <div class="cmp-mjsignal__body">
        <div class="cmp-mjsignal__claim" data-cmp-reveal>
            <p class="cmp-mjsignal__eyebrow" data-sly-test="${signal.eyebrow}">${signal.eyebrow}</p>
            <h2 class="cmp-mjsignal__statement" data-sly-test="${signal.statement}">${signal.statement}</h2>
        </div>

        <dl class="cmp-mjsignal__ledger" data-sly-test="${signal.items}">
            <!--/* A dt must precede its dd, so the label is written first and the CSS
                   flips the visual order to put the figure on top. */-->
            <div class="cmp-mjsignal__entry" data-sly-repeat.item="${signal.items}" data-cmp-reveal>
                <dt class="cmp-mjsignal__label">${item.label}</dt>
                <dd class="cmp-mjsignal__value">${item.value}</dd>
                <dd class="cmp-mjsignal__note" data-sly-test="${item.note}">${item.note}</dd>
            </div>
        </dl>

        <p class="cmp-mjsignal__footnote" data-sly-test="${signal.footnote}">${signal.footnote}</p>
    </div>
</section>

<sly data-sly-test="${!hasContent && wcmmode.edit}">
    <div class="cq-placeholder" data-emptytext="${'MJ Investment Signal' @ i18n}"></div>
</sly>
